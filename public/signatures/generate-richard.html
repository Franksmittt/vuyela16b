<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richard Clark Signature</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: #f0f0f0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .signature {
            width: 800px;
            height: 280px;
            background: #ffffff;
            position: relative;
            overflow: hidden;
        }
        .top-section {
            height: 200px;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            padding: 30px 40px;
            position: relative;
        }
        .left-info {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 10px;
        }
        .name {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .name .first {
            color: #FFD700;
        }
        .name .last {
            color: #1a1a1a;
        }
        .title {
            font-size: 12px;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
            font-weight: 600;
        }
        .photo-container {
            position: absolute;
            left: 50%;
            top: 80px;
            transform: translateX(-50%);
            z-index: 10;
        }
        .photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #FFD700;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .right-info {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 15px;
            gap: 12px;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #333;
        }
        .contact-icon {
            width: 22px;
            height: 22px;
            background: #FFD700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a1a;
            font-size: 12px;
        }
        .contact-text {
            color: #333;
        }
        .bottom-section {
            height: 80px;
            background: #1a1a1a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
        }
        .company-info {
            display: flex;
            flex-direction: column;
        }
        .company-name {
            font-size: 18px;
            font-weight: 700;
            color: #FFD700;
            letter-spacing: 1px;
        }
        .company-tagline {
            font-size: 10px;
            color: #888;
            font-style: italic;
        }
        .address {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #ccc;
        }
        .address-icon {
            color: #FFD700;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h2 style="margin-bottom: 20px; color: #333;">Richard Clark - Email Signature</h2>
    
    <div class="signature" id="signature">
        <div class="top-section">
            <div class="left-info">
                <div class="name">
                    <span class="first">RICHARD</span> <span class="last">CLARK</span>
                </div>
                <div class="title">General Manager</div>
            </div>
            
            <div class="photo-container">
                <div class="photo">
                    <img src="/images/staff/richard.jpg" alt="Richard Clark">
                </div>
            </div>
            
            <div class="right-info">
                <div class="contact-item">
                    <div class="contact-icon">📞</div>
                    <span class="contact-text">082 440 9827</span>
                </div>
                <div class="contact-item">
                    <div class="contact-icon">✉</div>
                    <span class="contact-text">richard@vuyelalogistics.co.za</span>
                </div>
                <div class="contact-item">
                    <div class="contact-icon">🌐</div>
                    <span class="contact-text">www.vuyelalogistics.co.za</span>
                </div>
            </div>
        </div>
        
        <div class="bottom-section">
            <div class="company-info">
                <div class="company-name">VUYELA GROUP</div>
                <div class="company-tagline">Locally Invested. Globally Connected.</div>
            </div>
            <div class="address">
                <span class="address-icon">📍</span>
                <span>Main Reef Rd, Elandsfontein, Germiston, 1601</span>
            </div>
        </div>
    </div>
</body>
</html>
